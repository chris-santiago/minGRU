[project]

site_name        = "mingru-scans"
site_description = "Parallel-scan minGRU variants with rotation-family mixers and an optional Triton kernel backend"
site_author      = "Chris Santiago"
site_url         = "https://chris-santiago.github.io/minGRU/"
docs_dir         = "docs"
site_dir         = "site"

repo_url  = "https://github.com/chris-santiago/minGRU"
repo_name = "chris-santiago/minGRU"
edit_uri  = "edit/main/docs/"

# MathJax pinned to an exact version (immutable jsdelivr URL) rather than a
# floating major tag, so a compromised or republished upstream tag cannot
# inject script into the published site.
extra_javascript = [
    "javascripts/mathjax.js",
    "https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js",
]

nav = [
    { "Home" = "index.md" },

    { "Tutorials" = [
        { "Overview"          = "tutorials/index.md" },
        { "Getting started"   = "tutorials/getting-started.md" },
        { "Two-layer stacks"  = "tutorials/two-layer-stacks.md" },
        { "Triton on GPU"     = "tutorials/triton-on-gpu.md" },
    ] },

    { "How-to" = [
        { "Overview"                = "how-to/index.md" },
        { "Choose a mixer"          = "how-to/choose-a-mixer.md" },
        { "Control scan dispatch"   = "how-to/control-scan-dispatch.md" },
        { "Run the benchmarks"      = "how-to/run-the-benchmarks.md" },
        { "Reproduce the evidence"  = "how-to/reproduce-the-evidence.md" },
    ] },

    { "Reference" = [
        { "Overview"        = "reference/index.md" },
        { "Mixers"          = "reference/mixers.md" },
        { "Scan operations" = "reference/scan-ops.md" },
        { "Triton kernels"  = "reference/triton-scans.md" },
    ] },

    { "Explanation" = [
        { "Overview"               = "explanation/index.md" },
        { "GivensMinGRU deep dive" = "explanation/givens-mingru.md" },
        { "Triton scan kernels"    = "explanation/triton-scans.md" },
    ] },

    { "Slides" = "slides/index.md" },
]


# ----------------------------------------------------------------------------
# Plugins: mkdocstrings autodoc (::: mingru.X directives in Reference pages).
# griffe reads the src-layout package statically -- no torch import needed.
# ----------------------------------------------------------------------------
[project.plugins.mkdocstrings]
default_handler = "python"

[project.plugins.mkdocstrings.handlers.python]
paths = ["src"]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "numpy"
show_source = false
show_root_heading = true
members_order = "source"
merge_init_into_class = true
docstring_section_style = "table"
separate_signature = true
show_signature_annotations = true


# ----------------------------------------------------------------------------
# Theme: modern variant of Material's look and feel.
# ----------------------------------------------------------------------------
[project.theme]
variant  = "classic"
language = "en"

features = [
    "announce.dismiss",

    # Per-page edit / view-source buttons (link to the page's own .md on GitHub).
    "content.action.edit",
    "content.action.view",

    # Code-block UX.
    "content.code.annotate",
    "content.code.copy",
    "content.code.select",

    "content.footnote.tooltips",
    "content.tabs.link",
    "content.tooltips",

    # Navigation.
    "navigation.expand",            # expand sidebar groups by default
    "navigation.footer",
    "navigation.indexes",           # section index doubles as section landing
    "navigation.instant",           # XHR nav, no full reload
    "navigation.instant.prefetch",
    "navigation.path",              # breadcrumbs
    "navigation.sections",
    "navigation.tabs",              # top-level sections as tabs
    "navigation.tabs.sticky",
    "navigation.top",               # back-to-top button
    "navigation.tracking",

    # Search.
    "search.highlight",
]

[project.theme.icon]
edit = "material/pencil"
view = "material/eye"

# Light + dark color schemes with a toggle.
[[project.theme.palette]]
scheme      = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme      = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"


# ----------------------------------------------------------------------------
# Markdown extensions — Material-equivalent set.
# ----------------------------------------------------------------------------
[project.markdown_extensions.abbr]
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.md_in_html]

[project.markdown_extensions.toc]
permalink = true

[project.markdown_extensions.pymdownx.arithmatex]
generic = true                      # MathJax-style equations

[project.markdown_extensions.pymdownx.betterem]
[project.markdown_extensions.pymdownx.caret]
[project.markdown_extensions.pymdownx.details]    # collapsible admonitions

[project.markdown_extensions.pymdownx.emoji]
emoji_generator = "zensical.extensions.emoji.to_svg"
emoji_index     = "zensical.extensions.emoji.twemoji"

[project.markdown_extensions.pymdownx.highlight]
anchor_linenums     = true
line_spans          = "__span"
pygments_lang_class = true

[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.keys]
[project.markdown_extensions.pymdownx.magiclink]
[project.markdown_extensions.pymdownx.mark]
[project.markdown_extensions.pymdownx.smartsymbols]

[project.markdown_extensions.pymdownx.superfences]
# Register the `mermaid` fence so ```mermaid blocks render as diagrams.
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" }
]

[project.markdown_extensions.pymdownx.tabbed]
alternate_style     = true
combine_header_slug = true

[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true

[project.markdown_extensions.pymdownx.tilde]
