name: Documentation

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One Pages deployment at a time. Don't cancel an in-progress deploy
# when a new run queues — let the running one finish first.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v6
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      # Pinned docs toolchain from pyproject's `docs` group. `--only-group`
      # installs just those tools (no project, no torch): griffe reads the
      # src-layout package statically, so the API reference renders without
      # importing mingru.
      - name: Build the docs site (pinned docs toolchain)
        run: uv run --only-group docs zensical build --clean
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
