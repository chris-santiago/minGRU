name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    # CPU-only suite. UV_TORCH_BACKEND=cpu resolves the CPU torch wheel instead
    # of the large default CUDA build; the tests never touch a GPU/Triton path.
    env:
      UV_TORCH_BACKEND: cpu
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Run the pytest suite (torch 2.8 CPU)
        run: uv run --python 3.12 --with 'torch==2.8.*' --with pytest python -m pytest tests/ -q
