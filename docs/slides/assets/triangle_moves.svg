<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 400" font-family="Helvetica,Arial,sans-serif">
<text x="200.0" y="34.0" font-size="22" fill="#1a4a7a" text-anchor="middle" font-weight="bold">S3 = the six moves of a triangle</text>
<line x1="200.0" y1="332.8" x2="200.0" y2="97.2" stroke="#d97706" stroke-width="2" stroke-dasharray="7 5"/>
<line x1="302.0" y1="156.1" x2="98.0" y2="273.9" stroke="#d97706" stroke-width="2" stroke-dasharray="7 5"/>
<line x1="98.0" y1="156.1" x2="302.0" y2="273.9" stroke="#d97706" stroke-width="2" stroke-dasharray="7 5"/>
<polygon points="200.0,123.0 120.3,261.0 279.7,261.0" fill="#eaf1f8" fill-opacity="0.9" stroke="#1a4a7a" stroke-width="3"/>
<text x="200.0" y="112.4" font-size="20" fill="#1a4a7a" text-anchor="middle" font-weight="bold">A</text>
<text x="106.0" y="275.3" font-size="20" fill="#1a4a7a" text-anchor="middle" font-weight="bold">B</text>
<text x="294.0" y="275.3" font-size="20" fill="#1a4a7a" text-anchor="middle" font-weight="bold">C</text>
<path d="M 84.0 160.9 A 128 128 0 0 1 316.0 160.9" fill="none" stroke="#15803d" stroke-width="3"/>
<polygon points="316.0,160.9 304.7,150.8 315.5,145.7" fill="#15803d"/>
<text x="200.0" y="355.0" font-size="19" fill="#15803d" text-anchor="middle" font-weight="bold">3 turns (0°, 120°, 240°)</text>
<text x="200.0" y="380.0" font-size="19" fill="#d97706" text-anchor="middle" font-weight="bold">+ 3 flips (the dashed mirrors)</text>
<text x="730.0" y="34.0" font-size="22" fill="#1a4a7a" text-anchor="middle" font-weight="bold">Which moves live inside each multiplier family?</text>
<rect x="420" y="66" width="300" height="62" rx="8" fill="#f8fafc" stroke="#b91c1c" stroke-width="2.5"/>
<text x="570.0" y="104.0" font-size="19" fill="#222" text-anchor="middle" font-weight="bold">a ∈ (0, 1) — fade only</text>
<line x1="732.0" y1="97.0" x2="772.0" y2="97.0" stroke="#b91c1c" stroke-width="2.5"/>
<polygon points="772,91.0 772,103.0 784,97.0" fill="#b91c1c"/>
<text x="796.0" y="92.0" font-size="19" fill="#b91c1c" text-anchor="start" font-weight="bold">no move inside — stuck</text>
<text x="796.0" y="116.0" font-size="18" fill="#6b7280" text-anchor="start" font-weight="normal" font-style="italic">rung 1: chance</text>
<rect x="420" y="154" width="300" height="62" rx="8" fill="#f8fafc" stroke="#d97706" stroke-width="2.5"/>
<text x="570.0" y="192.0" font-size="19" fill="#222" text-anchor="middle" font-weight="bold">a ∈ (−1, 1) — fade + flip</text>
<line x1="732.0" y1="185.0" x2="772.0" y2="185.0" stroke="#d97706" stroke-width="2.5"/>
<polygon points="772,179.0 772,191.0 784,185.0" fill="#d97706"/>
<text x="796.0" y="180.0" font-size="19" fill="#d97706" text-anchor="start" font-weight="bold">the flip inside — parity only</text>
<text x="796.0" y="204.0" font-size="18" fill="#6b7280" text-anchor="start" font-weight="normal" font-style="italic">rung 2: parity</text>
<rect x="420" y="242" width="300" height="62" rx="8" fill="#f8fafc" stroke="#15803d" stroke-width="2.5"/>
<text x="570.0" y="280.0" font-size="19" fill="#222" text-anchor="middle" font-weight="bold">2×2 turn-and-flip matrices</text>
<line x1="732.0" y1="273.0" x2="772.0" y2="273.0" stroke="#15803d" stroke-width="2.5"/>
<polygon points="772,267.0 772,279.0 784,273.0" fill="#15803d"/>
<text x="796.0" y="268.0" font-size="19" fill="#15803d" text-anchor="start" font-weight="bold">all six inside — S3 itself</text>
<text x="796.0" y="292.0" font-size="18" fill="#6b7280" text-anchor="start" font-weight="normal" font-style="italic">rung 3: S3</text>
<text x="745.0" y="372.0" font-size="18" fill="#222" text-anchor="middle" font-weight="normal" font-style="italic">You climb a rung when your multipliers first contain the group's own moves.</text>
</svg>