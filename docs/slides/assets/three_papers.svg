<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" font-family="Helvetica, Arial, sans-serif"><defs><marker id="arrB" markerWidth="9" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#1a4a7a"/></marker><marker id="arrO" markerWidth="9" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#d97706"/></marker><marker id="arrG" markerWidth="9" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#15803d"/></marker><marker id="arrR" markerWidth="9" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#b91c1c"/></marker><marker id="arrY" markerWidth="9" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#6b7280"/></marker></defs><rect width="960" height="420" fill="white"/><rect x="40" y="58" width="280" height="210" rx="12" fill="white" stroke="#15803d" stroke-width="2.5"/><text x="180" y="46" font-size="17" fill="#15803d" text-anchor="middle" font-weight="bold" >the opportunity</text><text x="180" y="92" font-size="16" fill="#333" text-anchor="middle" font-weight="bold" >Feng et al. 2024</text><text x="180" y="118" font-size="15" fill="#6b7280" text-anchor="middle" font-weight="normal" >“Were RNNs All We Needed?”</text><text x="180" y="158" font-size="15" fill="#333" text-anchor="middle" font-weight="normal" >Blind the gates to the state →</text><text x="180" y="184" font-size="15" fill="#333" text-anchor="middle" font-weight="normal" >a GRU trains as ONE</text><text x="180" y="210" font-size="15" fill="#333" text-anchor="middle" font-weight="normal" >parallel scan (minGRU)</text><line x1="180" y1="272" x2="480" y2="322" stroke="#6b7280" stroke-width="2" marker-end="url(#arrY)"/><rect x="340" y="58" width="280" height="210" rx="12" fill="white" stroke="#b91c1c" stroke-width="2.5"/><text x="480" y="46" font-size="17" fill="#b91c1c" text-anchor="middle" font-weight="bold" >the objection</text><text x="480" y="92" font-size="16" fill="#333" text-anchor="middle" font-weight="bold" >Merrill, Petty &amp; Sabharwal 2024</text><text x="480" y="118" font-size="15" fill="#6b7280" text-anchor="middle" font-weight="normal" >“The Illusion of State”</text><text x="480" y="158" font-size="15" fill="#333" text-anchor="middle" font-weight="normal" >The price is provable:</text><text x="480" y="184" font-size="15" fill="#333" text-anchor="middle" font-weight="normal" >fixed-depth scans are TC⁰ —</text><text x="480" y="210" font-size="15" fill="#333" text-anchor="middle" font-weight="normal" >no true state-tracking</text><line x1="480" y1="272" x2="480" y2="322" stroke="#6b7280" stroke-width="2" marker-end="url(#arrY)"/><rect x="640" y="58" width="280" height="210" rx="12" fill="white" stroke="#1a4a7a" stroke-width="2.5"/><text x="780" y="46" font-size="17" fill="#1a4a7a" text-anchor="middle" font-weight="bold" >the counter</text><text x="780" y="92" font-size="16" fill="#333" text-anchor="middle" font-weight="bold" >Grazzi et al. 2025 (two papers)</text><text x="780" y="118" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" >“Unlocking State-Tracking”, DeltaProduct</text><text x="780" y="158" font-size="15" fill="#333" text-anchor="middle" font-weight="normal" >Within the class, richer</text><text x="780" y="184" font-size="15" fill="#333" text-anchor="middle" font-weight="normal" >transitions (eigenvalues in (−1,1),</text><text x="780" y="210" font-size="15" fill="#333" text-anchor="middle" font-weight="normal" >Householder products) buy it back</text><line x1="780" y1="272" x2="480" y2="322" stroke="#6b7280" stroke-width="2" marker-end="url(#arrY)"/><rect x="120" y="330" width="720" height="66" rx="12" fill="#eaf1f8" stroke="#1a4a7a" stroke-width="2"/><text x="480" y="357" font-size="18" fill="#1a4a7a" text-anchor="middle" font-weight="bold" >this repo: hold the parallel-scan constraint FIXED —</text><text x="480" y="382" font-size="18" fill="#1a4a7a" text-anchor="middle" font-weight="bold" >measure what state-tracking a GRU can represent AND train back</text></svg>