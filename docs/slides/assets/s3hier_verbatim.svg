<text x="110.0" y="216.0" font-size="15" fill="#6b7280" text-anchor="start" font-weight="normal" font-style="italic">gray label = mid-pair: nothing to compose yet, the label just carries. green label = a pair completed: y[t] = g ∘ y[t−1].</text>
<text x="110.0" y="242.0" font-size="15" fill="#6b7280" text-anchor="start" font-weight="normal" font-style="italic">first pair (1,5) → g = 0, the identity — a real pair that does nothing: the state holds at 0 through t4.</text>
<text x="110.0" y="268.0" font-size="15" fill="#6b7280" text-anchor="start" font-weight="normal" font-style="italic">single sub-tokens are useless by design: LATIN is a Latin square, so knowing a alone (or b alone) says nothing about g.</text>
