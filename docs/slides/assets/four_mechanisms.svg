<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 445" font-family="Helvetica, Arial, sans-serif"><defs><marker id="arrB" markerWidth="9" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#1a4a7a"/></marker><marker id="arrO" markerWidth="9" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#d97706"/></marker><marker id="arrG" markerWidth="9" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#15803d"/></marker><marker id="arrR" markerWidth="9" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#b91c1c"/></marker><marker id="arrY" markerWidth="9" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#6b7280"/></marker></defs><rect width="1140" height="445" fill="white"/><text x="570" y="26" font-size="20" fill="#333" text-anchor="middle" font-weight="bold" >the same state, one token later — four transition families</text><text x="150" y="58" font-size="17" fill="#15803d" text-anchor="middle" font-weight="bold" >snapped rotation</text><circle cx="150" cy="205" r="72" fill="none" stroke="#d1d5db" stroke-width="1.5"/><circle cx="150" cy="205" r="2.5" fill="#6b7280" stroke="#6b7280" stroke-width="2"/><circle cx="222.0" cy="205.0" r="4" fill="#15803d" stroke="#15803d" stroke-width="2"/><circle cx="186.0" cy="142.64617092752042" r="4" fill="#15803d" stroke="#15803d" stroke-width="2"/><circle cx="114.00000000000001" cy="142.64617092752042" r="4" fill="#15803d" stroke="#15803d" stroke-width="2"/><circle cx="78.0" cy="205.0" r="4" fill="#15803d" stroke="#15803d" stroke-width="2"/><circle cx="113.99999999999997" cy="267.3538290724796" r="4" fill="#15803d" stroke="#15803d" stroke-width="2"/><circle cx="186.0" cy="267.3538290724796" r="4" fill="#15803d" stroke="#15803d" stroke-width="2"/><polyline points="150.0,205.0 150.0,139.0" fill="none" stroke="#6b7280" stroke-width="2.4" stroke-dasharray="5 4" marker-end="url(#arrY)"/><text x="164.0" y="131.0" font-size="13" fill="#6b7280" text-anchor="start" font-weight="normal" >before</text><polyline points="150.0,205.0 89.2,230.8" fill="none" stroke="#d97706" stroke-width="2" stroke-dasharray="3 3" marker-end="url(#arrO)"/><polyline points="150.0,205.0 92.8,238.0" fill="none" stroke="#15803d" stroke-width="3.2" marker-end="url(#arrG)"/><text x="150" y="307" font-size="14" fill="#333" text-anchor="middle" font-weight="normal" >soft θ snaps to the grid:</text><text x="150" y="327" font-size="14" fill="#333" text-anchor="middle" font-weight="normal" >lands EXACTLY on a group element</text><text x="150" y="353" font-size="13" fill="#15803d" text-anchor="middle" font-weight="normal" >errors cannot accumulate —</text><text x="150" y="371" font-size="13" fill="#15803d" text-anchor="middle" font-weight="normal" >if the grid contains your group</text><text x="430" y="58" font-size="17" fill="#1a4a7a" text-anchor="middle" font-weight="bold" >Givens product</text><circle cx="430" cy="205" r="72" fill="none" stroke="#d1d5db" stroke-width="1.5"/><circle cx="430" cy="205" r="2.5" fill="#6b7280" stroke="#6b7280" stroke-width="2"/><polyline points="430.0,205.0 430.0,139.0" fill="none" stroke="#6b7280" stroke-width="2.4" stroke-dasharray="5 4" marker-end="url(#arrY)"/><text x="444.0" y="131.0" font-size="13" fill="#6b7280" text-anchor="start" font-weight="normal" >before</text><polyline points="430.0,205.0 370.2,232.9" fill="none" stroke="#1a4a7a" stroke-width="3.2" marker-end="url(#arrB)"/><polyline points="430.0,205.0 368.4,233.7 368.8,234.6 369.2,235.5 369.7,236.4 370.1,237.3 370.6,238.1 371.1,239.0 430.0,205.0" fill="none" stroke="#b91c1c" stroke-width="1.2"/><text x="352" y="247" font-size="15" fill="#b91c1c" text-anchor="middle" font-weight="normal" >ε</text><text x="430" y="307" font-size="14" fill="#333" text-anchor="middle" font-weight="normal" >smooth turn, any angle, many</text><text x="430" y="327" font-size="14" fill="#333" text-anchor="middle" font-weight="normal" >coupled planes at once (SO(8))</text><text x="430" y="353" font-size="13" fill="#1a4a7a" text-anchor="middle" font-weight="normal" >rich + reliable to train —</text><text x="430" y="371" font-size="13" fill="#1a4a7a" text-anchor="middle" font-weight="normal" >but ε off-target compounds as εT</text><text x="710" y="58" font-size="17" fill="#d97706" text-anchor="middle" font-weight="bold" >Householder reflection</text><circle cx="710" cy="205" r="72" fill="none" stroke="#d1d5db" stroke-width="1.5"/><circle cx="710" cy="205" r="2.5" fill="#6b7280" stroke="#6b7280" stroke-width="2"/><line x1="772.3538290724796" y1="241.0" x2="647.6461709275204" y2="169.0" stroke="#d97706" stroke-width="2" stroke-dasharray="6 4"/><text x="653.6461709275204" y="163.0" font-size="12" fill="#d97706" text-anchor="start" font-weight="normal" >mirror ⊥ k</text><polyline points="710.0,205.0 710.0,139.0" fill="none" stroke="#6b7280" stroke-width="2.4" stroke-dasharray="5 4" marker-end="url(#arrY)"/><text x="724.0" y="131.0" font-size="13" fill="#6b7280" text-anchor="start" font-weight="normal" >before</text><polyline points="710.0,205.0 652.8,238.0" fill="none" stroke="#d97706" stroke-width="3.2" marker-end="url(#arrO)"/><text x="710" y="307" font-size="14" fill="#333" text-anchor="middle" font-weight="normal" >exact mirror image (β = 2)</text><text x="710" y="327" font-size="14" fill="#333" text-anchor="middle" font-weight="normal" >two mirrors = one rotation</text><text x="710" y="353" font-size="13" fill="#d97706" text-anchor="middle" font-weight="normal" >DeltaProduct: compose k mirrors —</text><text x="710" y="371" font-size="13" fill="#d97706" text-anchor="middle" font-weight="normal" >orthogonal only exactly at β = 2</text><text x="990" y="58" font-size="17" fill="#b91c1c" text-anchor="middle" font-weight="bold" >delta rule (β &lt; 2)</text><circle cx="990" cy="205" r="72" fill="none" stroke="#d1d5db" stroke-width="1.5"/><circle cx="990" cy="205" r="2.5" fill="#6b7280" stroke="#6b7280" stroke-width="2"/><line x1="990" y1="205" x2="990" y2="137" stroke="#6b7280" stroke-width="2" marker-end="url(#arrY)"/><text x="1000" y="149" font-size="14" fill="#6b7280" text-anchor="start" font-weight="normal" >k</text><polyline points="990.0,205.0 1027.9,150.9" fill="none" stroke="#6b7280" stroke-width="2.4" stroke-dasharray="5 4" marker-end="url(#arrY)"/><text x="1041.856044799169" y="142.93596507692655" font-size="13" fill="#6b7280" text-anchor="start" font-weight="normal" >before</text><polyline points="990.0,205.0 1027.9,189.7" fill="none" stroke="#b91c1c" stroke-width="3.2" marker-end="url(#arrR)"/><text x="1041.940363328873" y="181.6710981974209" font-size="13" fill="#b91c1c" text-anchor="start" font-weight="normal" >shorter</text><text x="990" y="307" font-size="14" fill="#333" text-anchor="middle" font-weight="normal" >shrink the k-component,</text><text x="990" y="327" font-size="14" fill="#333" text-anchor="middle" font-weight="normal" >write a new value in its place</text><text x="990" y="353" font-size="13" fill="#b91c1c" text-anchor="middle" font-weight="normal" >store, don't rotate — norm not</text><text x="990" y="371" font-size="13" fill="#b91c1c" text-anchor="middle" font-weight="normal" >preserved; wants a BIG state</text><text x="570" y="425" font-size="16" fill="#6b7280" text-anchor="middle" font-weight="normal" >all four are input-chosen linear maps — all four run on the same parallel scan; they differ in what surviving state looks like</text></svg>