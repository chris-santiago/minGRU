</text><text x="520" y="365" font-size="16" fill="#333" text-anchor="middle" font-weight="normal" >identity except rows/cols i and j</text><text x="520" y="388" font-size="15" fill="#6b7280" text-anchor="middle" font-weight="normal" >(c = cos θ, s = sin θ)</text><text x="710" y="45" font-size="19" fill="#1a4a7a" text-anchor="start" font-weight="bold" >why it's the atom</text><text x="710" y="90" font-size="16" fill="#333" text-anchor="start" font-weight="normal" >exactly orthogonal at EVERY θ —</text><text x="710" y="120" font-size="16" fill="#333" text-anchor="start" font-weight="normal" >no normalization, no projection</text><text x="710" y="180" font-size="16" fill="#333" text-anchor="start" font-weight="normal" >determinant +1 (pure rotation,</text><text x="710" y="210" font-size="16" fill="#333" text-anchor="start" font-weight="normal" >never a reflection)</text><text x="710" y="270" font-size="16" fill="#333" text-anchor="start" font-weight="normal" >one angle = one parameter</text><text x="710" y="330" font-size="16" fill="#333" text-anchor="start" font-weight="normal" >RotationMinGRU = the k = 2 case:</text><text x="710" y="360" font-size="16" fill="#333" text-anchor="start" font-weight="normal" >one plane IS the whole space</text></svg>