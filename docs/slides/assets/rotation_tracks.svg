<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" font-family="Helvetica, Arial, sans-serif"><defs><marker id="arrB" markerWidth="9" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#1a4a7a"/></marker><marker id="arrO" markerWidth="9" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#d97706"/></marker><marker id="arrG" markerWidth="9" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#15803d"/></marker><marker id="arrR" markerWidth="9" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#b91c1c"/></marker><marker id="arrY" markerWidth="9" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#6b7280"/></marker></defs><rect width="960" height="420" fill="white"/><text x="480" y="36" font-size="19" fill="#1a4a7a" text-anchor="middle" font-weight="bold" >state = a direction; every token turns it — and may flip it</text><circle cx="130" cy="205" r="62" fill="none" stroke="#d1d5db" stroke-width="2"/><circle cx="130" cy="205" r="3" fill="#6b7280" stroke="#6b7280" stroke-width="2"/><polyline points="130.0,205.0 130.0,151.0" fill="none" stroke="#1a4a7a" stroke-width="3.5" marker-end="url(#arrB)"/><text x="130" y="299" font-size="15" fill="#333" text-anchor="middle" font-weight="normal" >start</text><line x1="204" y1="205" x2="296" y2="205" stroke="#6b7280" stroke-width="2.2" marker-end="url(#arrY)"/><text x="250.0" y="191" font-size="15" fill="#6b7280" text-anchor="middle" font-weight="normal" >rotate (+120°)</text><circle cx="370" cy="205" r="62" fill="none" stroke="#d1d5db" stroke-width="2"/><circle cx="370" cy="205" r="3" fill="#6b7280" stroke="#6b7280" stroke-width="2"/><polyline points="370.0,205.0 323.2,232.0" fill="none" stroke="#1a4a7a" stroke-width="3.5" marker-end="url(#arrB)"/><line x1="444" y1="205" x2="536" y2="205" stroke="#6b7280" stroke-width="2.2" marker-end="url(#arrY)"/><text x="490.0" y="191" font-size="15" fill="#6b7280" text-anchor="middle" font-weight="normal" >swap = flip</text><circle cx="610" cy="205" r="62" fill="none" stroke="#d1d5db" stroke-width="2"/><circle cx="610" cy="205" r="3" fill="#6b7280" stroke="#6b7280" stroke-width="2"/><polyline points="610.0,205.0 656.8,232.0" fill="none" stroke="#b91c1c" stroke-width="3.5" stroke-dasharray="6 4" marker-end="url(#arrR)"/><line x1="684" y1="205" x2="776" y2="205" stroke="#6b7280" stroke-width="2.2" marker-end="url(#arrY)"/><text x="730.0" y="191" font-size="15" fill="#6b7280" text-anchor="middle" font-weight="normal" >rotate (+120°)</text><circle cx="850" cy="205" r="62" fill="none" stroke="#d1d5db" stroke-width="2"/><circle cx="850" cy="205" r="3" fill="#6b7280" stroke="#6b7280" stroke-width="2"/><polyline points="850.0,205.0 850.0,151.0" fill="none" stroke="#b91c1c" stroke-width="3.5" stroke-dasharray="6 4" marker-end="url(#arrR)"/><text x="850" y="299" font-size="15" fill="#b91c1c" text-anchor="middle" font-weight="normal" >net element: a flip — the label</text><text x="130" y="299" font-size="15" fill="#333" text-anchor="middle" font-weight="normal" >start</text><text x="480" y="355" font-size="15" fill="#6b7280" text-anchor="middle" font-weight="normal" >solid = even flips · dashed red = odd flips (reflected)</text><text x="480" y="394" font-size="17" fill="#333" text-anchor="middle" font-weight="normal" >composing the maps IS group multiplication — pure turns commute; the FLIP is the non-commutative ingredient</text></svg>