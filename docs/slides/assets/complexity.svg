<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 415" font-family="Helvetica, Arial, sans-serif"><defs><marker id="arrB" markerWidth="9" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#1a4a7a"/></marker><marker id="arrO" markerWidth="9" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#d97706"/></marker><marker id="arrG" markerWidth="9" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#15803d"/></marker><marker id="arrR" markerWidth="9" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#b91c1c"/></marker><marker id="arrY" markerWidth="9" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#6b7280"/></marker></defs><rect width="900" height="415" fill="white"/><rect x="30" y="30" width="840" height="330" rx="14" fill="white" stroke="#6b7280" stroke-width="2"/><text x="50" y="62" font-size="20" fill="#6b7280" text-anchor="start" font-weight="bold" >NC¹ — problems solvable by O(log T)-depth circuits</text><rect x="55" y="85" width="470" height="250" rx="12" fill="#eaf1f8" stroke="#1a4a7a" stroke-width="2"/><text x="75" y="117" font-size="20" fill="#1a4a7a" text-anchor="start" font-weight="bold" >TC⁰ — constant-depth parallel circuits</text><text x="75" y="141" font-size="15" fill="#6b7280" text-anchor="start" font-weight="normal" >(fixed number of parallel layers, with counting)</text><circle cx="88" cy="165" r="3.5" fill="#1a4a7a" stroke="#1a4a7a" stroke-width="2"/><text x="102" y="170" font-size="17" fill="#333" text-anchor="start" font-weight="normal" >minGRU family — every mixer in this talk</text><circle cx="88" cy="195" r="3.5" fill="#1a4a7a" stroke="#1a4a7a" stroke-width="2"/><text x="102" y="200" font-size="17" fill="#333" text-anchor="start" font-weight="normal" >Mamba / S6, gated linear attention (GLA)</text><circle cx="88" cy="225" r="3.5" fill="#1a4a7a" stroke="#1a4a7a" stroke-width="2"/><text x="102" y="230" font-size="17" fill="#333" text-anchor="start" font-weight="normal" >transformers at fixed depth</text><circle cx="88" cy="285" r="5" fill="#15803d" stroke="#15803d" stroke-width="2"/><text x="102" y="291" font-size="16" fill="#15803d" text-anchor="start" font-weight="normal" >S3 word problem (solvable group) — representable here</text><text x="570" y="117" font-size="20" fill="#333" text-anchor="start" font-weight="bold" >state-dependent recurrence</text><text x="570" y="143" font-size="17" fill="#333" text-anchor="start" font-weight="normal" >GRU, LSTM — gates read the state</text><text x="570" y="169" font-size="15" fill="#6b7280" text-anchor="start" font-weight="normal" >(the exact machinery we deleted)</text><circle cx="578" cy="215" r="5" fill="#b91c1c" stroke="#b91c1c" stroke-width="2"/><text x="592" y="221" font-size="16" fill="#b91c1c" text-anchor="start" font-weight="normal" >S5 word problem — NC¹-complete;</text><text x="592" y="243" font-size="16" fill="#b91c1c" text-anchor="start" font-weight="normal" >out of reach for any fixed-depth scan stack</text><text x="450" y="395" font-size="16" fill="#6b7280" text-anchor="middle" font-weight="normal" >assuming TC⁰ ≠ NC¹ (standard conjecture) · framing: Merrill, Petty &amp; Sabharwal 2024</text></svg>