<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" font-family="Helvetica, Arial, sans-serif"><defs><marker id="arrB" markerWidth="9" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#1a4a7a"/></marker><marker id="arrO" markerWidth="9" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#d97706"/></marker><marker id="arrG" markerWidth="9" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#15803d"/></marker><marker id="arrR" markerWidth="9" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#b91c1c"/></marker><marker id="arrY" markerWidth="9" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#6b7280"/></marker></defs><rect width="920" height="420" fill="white"/><text x="240" y="40" font-size="22" fill="#1a4a7a" text-anchor="middle" font-weight="bold" >constant depth</text><circle cx="70" cy="330" r="7" fill="#eaf1f8" stroke="#1a4a7a" stroke-width="2"/><circle cx="118" cy="330" r="7" fill="#eaf1f8" stroke="#1a4a7a" stroke-width="2"/><circle cx="166" cy="330" r="7" fill="#eaf1f8" stroke="#1a4a7a" stroke-width="2"/><circle cx="214" cy="330" r="7" fill="#eaf1f8" stroke="#1a4a7a" stroke-width="2"/><circle cx="262" cy="330" r="7" fill="#eaf1f8" stroke="#1a4a7a" stroke-width="2"/><circle cx="310" cy="330" r="7" fill="#eaf1f8" stroke="#1a4a7a" stroke-width="2"/><circle cx="358" cy="330" r="7" fill="#eaf1f8" stroke="#1a4a7a" stroke-width="2"/><circle cx="406" cy="330" r="7" fill="#eaf1f8" stroke="#1a4a7a" stroke-width="2"/><text x="240" y="368" font-size="16" fill="#6b7280" text-anchor="middle" font-weight="normal" >inputs x1 … xT   (T can grow)</text><rect x="86" y="218" width="88" height="34" rx="8" fill="white" stroke="#1a4a7a" stroke-width="2"/><text x="130" y="241" font-size="14" fill="#1a4a7a" text-anchor="middle" font-weight="normal" >sum ≥ 2?</text><line x1="70" y1="321" x2="130" y2="254" stroke="#d1d5db" stroke-width="1"/><line x1="118" y1="321" x2="130" y2="254" stroke="#d1d5db" stroke-width="1"/><line x1="166" y1="321" x2="130" y2="254" stroke="#d1d5db" stroke-width="1"/><line x1="214" y1="321" x2="130" y2="254" stroke="#d1d5db" stroke-width="1"/><line x1="262" y1="321" x2="130" y2="254" stroke="#d1d5db" stroke-width="1"/><line x1="310" y1="321" x2="130" y2="254" stroke="#d1d5db" stroke-width="1"/><line x1="358" y1="321" x2="130" y2="254" stroke="#d1d5db" stroke-width="1"/><line x1="406" y1="321" x2="130" y2="254" stroke="#d1d5db" stroke-width="1"/><rect x="196" y="218" width="88" height="34" rx="8" fill="white" stroke="#1a4a7a" stroke-width="2"/><text x="240" y="241" font-size="14" fill="#1a4a7a" text-anchor="middle" font-weight="normal" >sum ≥ 4?</text><line x1="70" y1="321" x2="240" y2="254" stroke="#d1d5db" stroke-width="1"/><line x1="118" y1="321" x2="240" y2="254" stroke="#d1d5db" stroke-width="1"/><line x1="166" y1="321" x2="240" y2="254" stroke="#d1d5db" stroke-width="1"/><line x1="214" y1="321" x2="240" y2="254" stroke="#d1d5db" stroke-width="1"/><line x1="262" y1="321" x2="240" y2="254" stroke="#d1d5db" stroke-width="1"/><line x1="310" y1="321" x2="240" y2="254" stroke="#d1d5db" stroke-width="1"/><line x1="358" y1="321" x2="240" y2="254" stroke="#d1d5db" stroke-width="1"/><line x1="406" y1="321" x2="240" y2="254" stroke="#d1d5db" stroke-width="1"/><rect x="306" y="218" width="88" height="34" rx="8" fill="white" stroke="#1a4a7a" stroke-width="2"/><text x="350" y="241" font-size="14" fill="#1a4a7a" text-anchor="middle" font-weight="normal" >sum ≥ 6?</text><line x1="70" y1="321" x2="350" y2="254" stroke="#d1d5db" stroke-width="1"/><line x1="118" y1="321" x2="350" y2="254" stroke="#d1d5db" stroke-width="1"/><line x1="166" y1="321" x2="350" y2="254" stroke="#d1d5db" stroke-width="1"/><line x1="214" y1="321" x2="350" y2="254" stroke="#d1d5db" stroke-width="1"/><line x1="262" y1="321" x2="350" y2="254" stroke="#d1d5db" stroke-width="1"/><line x1="310" y1="321" x2="350" y2="254" stroke="#d1d5db" stroke-width="1"/><line x1="358" y1="321" x2="350" y2="254" stroke="#d1d5db" stroke-width="1"/><line x1="406" y1="321" x2="350" y2="254" stroke="#d1d5db" stroke-width="1"/><text x="240" y="205" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" >each gate reads ALL inputs — different question, same everything</text><rect x="196" y="118" width="88" height="34" rx="8" fill="white" stroke="#1a4a7a" stroke-width="2"/><text x="240" y="141" font-size="14" fill="#1a4a7a" text-anchor="middle" font-weight="normal" >combine</text><line x1="130" y1="216" x2="240" y2="154" stroke="#6b7280" stroke-width="1.5"/><line x1="240" y1="216" x2="240" y2="154" stroke="#6b7280" stroke-width="1.5"/><line x1="350" y1="216" x2="240" y2="154" stroke="#6b7280" stroke-width="1.5"/><line x1="240" y1="116" x2="240" y2="78" stroke="#6b7280" stroke-width="2" marker-end="url(#arrY)"/><text x="240" y="64" font-size="15" fill="#6b7280" text-anchor="middle" font-weight="normal" >output</text><line x1="430" y1="330" x2="430" y2="130" stroke="#15803d" stroke-width="2.5" marker-end="url(#arrG)"/><text x="444" y="200" font-size="17" fill="#15803d" text-anchor="start" font-weight="bold" >depth = 2</text><text x="444" y="224" font-size="14" fill="#15803d" text-anchor="start" font-weight="normal" >fixed, however</text><text x="444" y="243" font-size="14" fill="#15803d" text-anchor="start" font-weight="normal" >long T gets</text><text x="285" y="400" font-size="15" fill="#333" text-anchor="middle" font-weight="normal" >unbounded fan-in is the trick: one gate spans the whole input, so depth never grows</text><line x1="560" y1="40" x2="560" y2="400" stroke="#d1d5db" stroke-width="2" stroke-dasharray="6 6"/><text x="760" y="40" font-size="22" fill="#333" text-anchor="middle" font-weight="bold" >state-dependent recurrence</text><circle cx="620" cy="320" r="15" fill="white" stroke="#6b7280" stroke-width="2"/><text x="620" y="325" font-size="13" fill="#333" text-anchor="middle" font-weight="normal" >h₁</text><circle cx="675" cy="272" r="15" fill="white" stroke="#6b7280" stroke-width="2"/><text x="675" y="277" font-size="13" fill="#333" text-anchor="middle" font-weight="normal" >h₂</text><line x1="631" y1="309" x2="664" y2="283" stroke="#b91c1c" stroke-width="2.2" marker-end="url(#arrR)"/><circle cx="730" cy="224" r="15" fill="white" stroke="#6b7280" stroke-width="2"/><text x="730" y="229" font-size="13" fill="#333" text-anchor="middle" font-weight="normal" >h₃</text><line x1="686" y1="261" x2="719" y2="235" stroke="#b91c1c" stroke-width="2.2" marker-end="url(#arrR)"/><circle cx="785" cy="176" r="15" fill="white" stroke="#6b7280" stroke-width="2"/><text x="785" y="181" font-size="13" fill="#333" text-anchor="middle" font-weight="normal" >h₄</text><line x1="741" y1="213" x2="774" y2="187" stroke="#b91c1c" stroke-width="2.2" marker-end="url(#arrR)"/><circle cx="840" cy="128" r="15" fill="white" stroke="#6b7280" stroke-width="2"/><text x="840" y="133" font-size="13" fill="#333" text-anchor="middle" font-weight="normal" >h₅</text><line x1="796" y1="165" x2="829" y2="139" stroke="#b91c1c" stroke-width="2.2" marker-end="url(#arrR)"/><text x="870" y="140" font-size="26" fill="#6b7280" text-anchor="middle" font-weight="normal" >…</text><text x="760" y="380" font-size="15" fill="#333" text-anchor="middle" font-weight="normal" >every step depends on the last —</text><text x="760" y="400" font-size="15" fill="#333" text-anchor="middle" font-weight="normal" >the dependency chain (depth) grows with T</text><text x="690" y="120" font-size="17" fill="#b91c1c" text-anchor="middle" font-weight="bold" >depth = T</text></svg>