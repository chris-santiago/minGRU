<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1030 420" font-family="Helvetica, Arial, sans-serif"><defs><marker id="arrB" markerWidth="9" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#1a4a7a"/></marker><marker id="arrO" markerWidth="9" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#d97706"/></marker><marker id="arrG" markerWidth="9" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#15803d"/></marker><marker id="arrR" markerWidth="9" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#b91c1c"/></marker><marker id="arrY" markerWidth="9" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#6b7280"/></marker></defs><rect width="1030" height="420" fill="white"/><text x="235" y="40" font-size="19" fill="#1a4a7a" text-anchor="middle" font-weight="bold" >the transition (I − β k kᵀ)</text><line x1="55" y1="300" x2="425" y2="300" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="7 5"/><text x="418" y="324" font-size="15" fill="#6b7280" text-anchor="end" font-weight="normal" >plane ⊥ k</text><line x1="235" y1="300" x2="235" y2="170" stroke="#1a4a7a" stroke-width="3" marker-end="url(#arrB)"/><text x="219" y="182" font-size="18" fill="#1a4a7a" text-anchor="end" font-weight="bold" >k</text><line x1="235" y1="300" x2="365" y2="205" stroke="#333" stroke-width="2.5" marker-end="url(#arrY)"/><text x="377" y="200" font-size="17" fill="#333" text-anchor="start" font-weight="normal" >x</text><line x1="235" y1="300" x2="365" y2="395" stroke="#15803d" stroke-width="2.5" marker-end="url(#arrG)"/><text x="377" y="404" font-size="15" fill="#15803d" text-anchor="start" font-weight="normal" >β = 2: exact reflection — orthogonal</text><line x1="235" y1="300" x2="365" y2="300" stroke="#d97706" stroke-width="2.5" marker-end="url(#arrO)"/><text x="377" y="290" font-size="15" fill="#d97706" text-anchor="start" font-weight="normal" >β = 1: erase the k-component</text><line x1="365" y1="208" x2="365" y2="390" stroke="#d1d5db" stroke-width="1.2" stroke-dasharray="3 4"/><text x="160" y="404" font-size="16" fill="#333" text-anchor="middle" font-weight="normal" >orthogonal ONLY at β = 2</text><text x="720" y="40" font-size="19" fill="#1a4a7a" text-anchor="middle" font-weight="bold" >a key-value memory, updated by write-erase</text><text x="720" y="82" font-size="19" fill="#333" text-anchor="middle" font-weight="normal" >Sₜ = Sₜ₋₁(I − βₜ kₜ kₜᵀ) + βₜ vₜ kₜᵀ</text><rect x="560" y="110" width="260" height="34" rx="5" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.2"/><rect x="560" y="152" width="260" height="34" rx="5" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.2"/><rect x="560" y="194" width="260" height="34" rx="5" fill="#fdecec" stroke="#d1d5db" stroke-width="1.2"/><rect x="560" y="236" width="260" height="34" rx="5" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.2"/><text x="690" y="216" font-size="14" fill="#b91c1c" text-anchor="middle" font-weight="normal" >slot at key k</text><text x="845" y="195" font-size="15" fill="#b91c1c" text-anchor="start" font-weight="normal" >erase the old value</text><rect x="560" y="300" width="260" height="34" rx="5" fill="#e8f4ea" stroke="#15803d" stroke-width="1.5"/><text x="690" y="322" font-size="15" fill="#15803d" text-anchor="middle" font-weight="normal" >β v kᵀ</text><text x="845" y="322" font-size="15" fill="#15803d" text-anchor="start" font-weight="normal" >write the new one</text><line x1="690" y1="282" x2="690" y2="296" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrY)"/><text x="720" y="385" font-size="16" fill="#333" text-anchor="middle" font-weight="normal" >state = a matrix (e.g. 16×64 = 1024 numbers), not a vector</text></svg>